                <!-- avatar -->
                <template id="avatar-template">
    <a-entity class="avatar">
    <a-sphere class="head colorized-pain collide-body"
        cursor-listener
        scale="0.45 0.5 0.4"
      ></a-sphere>
      <a-entity class="face"
        position="0 0.05 0"
      >
        <a-sphere class="eye"
          color="#efefef"
          position="0.16 0.1 -0.35"
          scale="0.12 0.12 0.12"
        >

            color="#000"
            position="0 0 -1"
            scale="0.2 0.2 0.2"
          ></a-sphere>
        </a-sphere>
        <a-sphere class="eye"
          color="#efefef"
          position="-0.16 0.1 -0.35"
          scale="0.12 0.12 0.12"
        >
          <a-sphere class="pupil"
            color="#000"
            position="0 0 -1"
            scale="0.2 0.2 0.2"
          ></a-sphere>
        </a-sphere>
      </a-entity>
      <a-entity class="gun">
        <a-box
          position="0.51 -0.13 -0.29"
          scale="0.19 0.23 0.67"
          color="#000"
        ></a-box>
        <a-entity class="gun-tip"
          position="0.51 -0.10 -0.64"
        ></a-entity>
      </a-entity>
    </a-entity>
  </template>

</template>

                <!-- tower -->
                <a-asset-item id="sculpture" src="assets/models/sculpture.glb"></a-asset-item>
<img id="tower-texture" src="assets/img/tower-texture.jpg"></img>
<template id="tower">
    <a-box class="hard-body collide-body tower" height="5" width="4" depth="4" opacity="0">
        <a-gltf-model src="#sculpture" rotation="0 45 0"></a-gltf-model>
        <a-gltf-model src="#sculpture" rotation="0 45 0" position="0 2 0"></a-gltf-model>
        <a-sphere animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;" src="#tower-texture" class="tower-sphere colorized-pain" opacity="1" position="0 7 0" radius="2.5"></a-sphere>
    </a-box>
</template>


<template id="tower-base">
    <a-box opacity="0">
        <a-sphere animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;" src="#tower-texture" class="tower-sphere colorized-pain" radius="3" position="0 4 0"></a-sphere>
    </a-box>
</template>


        <!-- /Templates -->
    </a-assets>

    
                <!-- player -->
                <a-entity id="player"
    networked="template:#avatar-template;attachTemplateToLocal:false;"
    camera
    position="0 1.8 0"
    spawn-in-circle="radius:3"
    touch-wasd-controls="acceleration:30"
    gun="bulletTemplate:#bullet-template"
>

    <a-box
        class="head colorized-pain"
        hard-body-sensitive = 'elementPosition: #player'
        visible="false"
        height="0.4"
        depth="0.4"
        width="0.4"
    ></a-box>

    <a-entity
        cursor="fuse: true; fuseTimeout: 500"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        material="color: black; shader: flat"
        id="cursor">
    </a-entity>

</a-entity>

<script>
    const matchId = location.search.split('match-id=')[1];
    document.getElementsByTagName('a-scene')[0].setAttribute('networked-scene', `room: ${matchId}; debug: true;`);
    console.log(matchId);
    // On mobile remove elements that are resource heavy
    var isMobile = AFRAME.utils.device.isMobile();


    document.getElementById('player').setAttribute(isMobile ? 'touch-controls' : 'look-controls', '');
    //     var particles = document.getElementById('particles');
    //     particles.parentNode.removeChild(particles);
    // look-controls
    // Define custom schema for syncing avatar components
    NAF.schemas.add({
        template: '#avatar-template',
        components: [
            'position',
            'rotation',
            {
                selector: '.head',
                component: 'material'
            },
            {
                selector: '.head',
                component: 'target-id'
            },

        ]
    });
</script>


<div id="mask-pain"
    style="display: none; width: 100%; height: 100%; position: fixed; top: 0; left: 0; background-color: brown; opacity: .2; transition: .3s;">
</div>

<div id="left-touch-joystic"
    style="display:flex; justify-content: center; align-items: center; border-radius:50%; position: fixed; left: 5; bottom: 5; height: 110px; width: 110px; background-color: rgb(46, 41, 41); opacity: .2;">
    <div class="stick"
        style="border-radius:50%;height: 30px; width: 30px; background-color:black; border:1px solid white;"></div>
</div>
<div class="fire"
    onclick="fire()"
    ontouchstart="fire()"
    style="border-radius:50%;position: fixed; right: 20; bottom: 60;height: 50px; width: 50px; background-color:red; border:1px solid white;">
</div>

<div id="log"  style="top: 0; left:0;color:black; position: fixed;"></div>
<script>
    window.log = document.getElementById('log');
