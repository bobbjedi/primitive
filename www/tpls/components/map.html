<a-assets>
    <!-- <img id="boxTexture" src="https://i.imgur.com/mYmmbrp.jpg"> -->
    <img id="boxTexture" src="assets/img/stone-wall.jpg">
    <img id="plants" src="assets/img/stones.jpg">
    <a-asset-item id="sculpture" src="assets/models/sculpture.glb"></a-asset-item>
    <!-- <template id="hard">
        <a-entity scale="0.001 0.001 0.001" geometry="primitive: box" material="color: red"></a-entity>
    </template>

    <a-mixin id="hard-body-el" template="hard" color="blue"></a-mixin> -->
    <template id="tower">
        <a-box class="hard-body" height="5" width="4" depth="4" opacity="0" color="red">
            <a-gltf-model src="#sculpture" rotation="0 45 0"></a-gltf-model>
            <a-gltf-model src="#sculpture" rotation="0 45 0" position="0 4 0"></a-gltf-model>
            <a-sphere color="red" opacity=".5" position="0 9 0" radius="2.5"></a-sphere>
        </a-box>
    </template>
</a-assets>

<a-box height="10" color="red" position="0 5 0" opacity="0.5"></a-box>

<a-entity position="10 1 0" template="tower"></a-entity>

<!-- Боковые стены -->
<!-- задняя -->
<a-box class="hard-body" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 100" opacity="1"></a-box>
<!-- передняя -->
<a-box class="hard-body" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 -100" opacity="1"></a-box>
<!-- правая -->
<a-box class="hard-body" src="#plants" height="5" repeat="100" width="200" depth=".1" position="75 2.5 0" rotation="0 90 0" opacity="1"></a-box>
<!-- левая -->
<a-box class="hard-body" src="#plants" height="5" repeat="100" width="200" depth=".1" position="-75 2.5 0" rotation="0 90 0" opacity="1"></a-box>

<!-- передняя красная база -->

<a-sphere color="red" radius="10" position="0 0 -90" opacity="0.2"></a-sphere>
<!-- Стена перед шаром -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="4" width="15" depth=".1" position="0 1.2 -73"
    rotation="0 0 0"></a-box>
<!-- справа -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="10 1.2 -90"
    rotation="0 90 0"></a-box>
<!-- слева -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="-10 1.2 -90"
    rotation="0 90 0"></a-box>



<!-- передняя синяя база -->
<a-sphere color="blue" radius="10" position="0 0 90" opacity="0.2"></a-sphere>
<!-- Стена перед шаром -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="4" width="15" depth=".1" position="0 1.2 73"
    rotation="0 0 0"></a-box>
<!-- справа -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="10 1.2 90"
    rotation="0 90 0"></a-box>
<!-- слева -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="-10 1.2 90"
    rotation="0 90 0"></a-box>
