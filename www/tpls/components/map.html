<!-- Боковые стены -->
<!-- задняя -->
<a-box class="hard-body collide-body wall" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 100" opacity="1"></a-box>
<!-- передняя -->
<a-box class="hard-body collide-body wall" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 -100" opacity="1"></a-box>
<!-- правая -->
<a-box class="hard-body collide-body wall" src="#plants" height="5" repeat="25" width="200" depth=".1" position="75 2.5 0" rotation="0 90 0" opacity="1"></a-box>
<!-- левая -->
<a-box class="hard-body collide-body wall" src="#plants" height="5" repeat="25" width="200" depth=".1" position="-75 2.5 0" rotation="0 90 0" opacity="1"></a-box>

<a-box class="hard-body collide-body wall" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="-10 1.2 -90"
