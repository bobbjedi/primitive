<html>
  <head>
    <meta charset="utf-8">
    <title>Shooter Example — Networked-Aframe</title>
    <meta name="description" content="Shooter Example — Networked-Aframe">

    <script src="./client/libs/aframe.1.0.3.min.js"></script>
    <!-- <script src="//cdn.rawgit.com/donmccurdy/aframe-physics-system/v4.0.1/dist/aframe-physics-system.min.js"></script> -->
    <script src="./client/libs/build.js"></script>
    <!-- <script src="./client/listeners.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.slim.js"></script> -->

    <!-- <script>window.NAF || document.write('<script src="./client/libs/networked-aframe.min.js">\x3C/script>')</script> -->
    <!-- <script src="./client/libs/randomiser.component.js"></script>
    <script src="./client/components/spawn-in-circle.component.js"></script>
    <script src="./client/components/gun.component.js"></script>
    <script src="./client/components/forward.component.js"></script>
    <script src="./client/components/remove-in-seconds.component.js"></script> -->
    <script src="./build-app.js"></script>


  </head>
  <body>

    <a-scene
    physics="debug: true;gravity:-10; friction: 100;"
    networked-scene="
      room: shooter;
      debug: true;
    ">
<!--
    <a-box id="anchor" position="0 1 0"  body="type:dynamic;angularDamping:1;linearDamping:0" constraint = "target:#floor;"></a-box>
    <a-box id="anchor" position="2 1 2"  body="type:dynamic;"></a-box> -->
    <a-assets>

        <img id="grid" src="https://img.gs/bbdkhfbzkk/stretch/https://i.imgur.com/25P1geh.png" crossorigin="anonymous">
        <img id="sky" src="https://img.gs/bbdkhfbzkk/2048x2048,stretch/https://i.imgur.com/WqlqEkq.jpg" crossorigin="anonymous" />

        <!-- Templates -->

        <!-- Avatar -->
        <template id="avatar-template">
          <a-entity class="avatar cached" cursor-listener>
            <a-sphere class="head"
              scale="0.45 0.5 0.4"
              color="green"
            ></a-sphere>
            <a-entity class="face"
              position="0 0.05 0"
            >
              <a-sphere class="eye"
                color="#efefef"
                position="0.16 0.1 -0.35"
                scale="0.12 0.12 0.12"
              >
                <a-sphere class="pupil"
                  color="#000"
                  position="0 0 -1"
                  scale="0.2 0.2 0.2"
                ></a-sphere>
              </a-sphere>
              <a-sphere class="eye"
                color="#efefef"
                position="-0.16 0.1 -0.35"
                scale="0.12 0.12 0.12"
              >
                <a-sphere class="pupil"
                  color="#000"
                  position="0 0 -1"
                  scale="0.2 0.2 0.2"
                ></a-sphere>
              </a-sphere>
            </a-entity>
            <a-entity class="gun">
              <a-box
                position="0.51 -0.13 -0.29"
                scale="0.19 0.23 0.67"
                color="#000"
              ></a-box>
              <a-entity class="gun-tip"
                position="0.51 -0.10 -0.64"
              ></a-entity>
            </a-entity>
          </a-entity>
        </template>

        <!-- Bullet -->
        <template id="bullet-template">
        <a-entity class="bullet">
            <a-sphere
              radius="0.2"
              random-color
            ></a-sphere>
        </a-entity>
        </template>

        <!-- /Templates -->
      </a-assets>

      <a-entity id="player"
        networked="template:#avatar-template;attachTemplateToLocal:false;"
        camera
        position="0 1.6 0"
        spawn-in-circle="radius:3"
        wasd-controls look-controls
        gun="bulletTemplate:#bullet-template"
        >

        <a-sphere class="head"
          visible="false"
          random-color
        ></a-sphere>
        <a-entity
          cursor="fuse: true; fuseTimeout: 500"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: black; shader: flat"
        >
      </a-entity>

      </a-entity>

      <!-- ПОЛ -->
      <a-entity
        id="floor"
        position="0 0 0"
        geometry="primitive: plane; width: 10000; height: 10000;" rotation="-90 0 0"
        material="src: #grid; repeat: 10000 10000; transparent: true; metalness:0.6; roughness: 0.4; sphericalEnvMap: #sky;"></a-entity>

      <a-entity light="color: #ccccff; intensity: 1; type: ambient;" visible=""></a-entity>
      <a-entity light="color: #ffaaff; intensity: 1.5" position="5 5 5"></a-entity>

      <a-sky src="#sky" rotation="0 -90 0"></a-sky>
      <a-entity id="particles" particle-system="preset: snow"></a-entity>

    </a-scene>


    <script>
      // On mobile remove elements that are resource heavy
      var isMobile = AFRAME.utils.device.isMobile();

      if (isMobile) {
        var particles = document.getElementById('particles');
        particles.parentNode.removeChild(particles);
      }
    </script>

    <script>
      // Define custom schema for syncing avatar components
      NAF.schemas.add({
        template: '#avatar-template',
        components: [
          'position',
          'rotation',
          {
            selector: '.head',
            component: 'material'
          }
        ]
      });
    </script>
    <div id="mask-pain" style="display: none; width: 100%; height: 100%; position: fixed; top: 0; left: 0; background-color: brown; opacity: .2; transition: .3s;"></div>
  </body>
</html>
