  <head>
    <meta charset="utf-8">
    <title>Shooter Example — Networked-Aframe</title>
    <meta name="description" content="Shooter Example — Networked-Aframe">

    <script src="./client/libs/aframe.1.0.3.min.js"></script>

    <script src="./client/components/envroinment.component.js"></script>

  <body>


<a-scene
    physics="debug: true;gravity:-10; friction: 100;"
    networked-scene="
      room: shooter;
      debug: true;
    ">


                <!-- map -->
                <a-assets>
    <!-- <img id="boxTexture" src="https://i.imgur.com/mYmmbrp.jpg"> -->
    <img id="boxTexture" src="assets/img/stone-wall.jpg">
    <img id="plants" src="assets/img/stones.jpg">
    <a-asset-item id="sculpture" src="assets/models/sculpture.glb"></a-asset-item>

    <template id="tower">
        <a-box class="hard-body" height="5" width="4" depth="4" opacity="0">
            <a-gltf-model src="#sculpture" rotation="0 45 0"></a-gltf-model>
            <a-gltf-model src="#sculpture" rotation="0 45 0" position="0 2 0"></a-gltf-model>
            <a-sphere class="tower-sphere targetable" opacity=".5" position="0 7 0" radius="2.5"></a-sphere>
        </a-box>
    </template>
</a-assets>

<a-box height="10" color="red" position="0 5 0" opacity="0.5"></a-box>

<!-- Башни -->

<a-entity class="tower" id="tower-red-1" position="0 1 -30" template="tower" tower="red"></a-entity>
<a-entity class="tower" id="tower-red-2" position="-12 1 -73" template="tower" tower="red"></a-entity>
<a-entity class="tower" id="tower-red-3" position="12 1 -73" template="tower" tower="red"></a-entity>

<a-entity id="tower-blue-1" position="0 1 30" template="tower" tower="blue"></a-entity>
<a-entity id="tower-blue-2" position="-12 1 73" template="tower" tower="blue"></a-entity>
<a-entity id="tower-blue-3" position="12 1 73" template="tower" tower="blue"></a-entity>


<!-- Боковые стены -->
<!-- задняя -->
<a-box class="hard-body" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 100" opacity="1"></a-box>
<!-- передняя -->
<a-box class="hard-body" src="#plants" height="5" repeat="15" width="150" depth=".1" position="0 2.5 -100" opacity="1"></a-box>
<!-- правая -->
<a-box class="hard-body" src="#plants" height="5" repeat="100" width="200" depth=".1" position="75 2.5 0" rotation="0 90 0" opacity="1"></a-box>
<!-- левая -->
<a-box class="hard-body" src="#plants" height="5" repeat="100" width="200" depth=".1" position="-75 2.5 0" rotation="0 90 0" opacity="1"></a-box>

<!-- передняя красная база -->

<a-sphere color="red" radius="10" position="0 0 -90" opacity="0.2"></a-sphere>
<!-- Стена перед шаром -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="4" width="15" depth=".1" position="0 1.2 -73"
    rotation="0 0 0"></a-box>
<!-- справа -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="10 1.2 -90"
    rotation="0 90 0"></a-box>
<!-- слева -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="-10 1.2 -90"
    rotation="0 90 0"></a-box>



<!-- передняя синяя база -->
<a-sphere color="blue" radius="10" position="0 0 90" opacity="0.2"></a-sphere>
<!-- Стена перед шаром -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="4" width="15" depth=".1" position="0 1.2 73"
    rotation="0 0 0"></a-box>
<!-- справа -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="10 1.2 90"
    rotation="0 90 0"></a-box>
<!-- слева -->
<a-box class="hard-body" src="#boxTexture" height="2.5" repeat="5" width="25" depth=".1" position="-10 1.2 90"
    rotation="0 90 0"></a-box>


    <a-assets>
        <!-- Templates -->


                <!-- avatar -->
                <template id="avatar-template">
    <a-entity class="avatar cached" cursor-listener>
      <a-sphere class="head hard-body targetable"
        scale="0.45 0.5 0.4"
        color="green"
      ></a-sphere>
      <a-entity class="face"
        position="0 0.05 0"
      >
        <a-sphere class="eye"
          color="#efefef"
          position="0.16 0.1 -0.35"
          scale="0.12 0.12 0.12"
        >
          <a-sphere class="pupil"
            color="#000"
            position="0 0 -1"
            scale="0.2 0.2 0.2"
          ></a-sphere>
        </a-sphere>
        <a-sphere class="eye"
          color="#efefef"
          position="-0.16 0.1 -0.35"
          scale="0.12 0.12 0.12"
        >
          <a-sphere class="pupil"
            color="#000"
            position="0 0 -1"
            scale="0.2 0.2 0.2"
          ></a-sphere>
        </a-sphere>
      </a-entity>
      <a-entity class="gun">
        <a-box
          position="0.51 -0.13 -0.29"
          scale="0.19 0.23 0.67"
          color="#000"
        ></a-box>
        <a-entity class="gun-tip"
          position="0.51 -0.10 -0.64"
        ></a-entity>
      </a-entity>
    </a-entity>
  </template>


                <!-- bullet -->
                <template id="bullet-template">
    <a-entity class="bullet">
        <a-sphere
        radius="0.2"
        random-color
        ></a-sphere>
    </a-entity>
</template>


        <!-- /Templates -->
    </a-assets>


                <!-- player -->
                <a-entity id="player"
    networked="template:#avatar-template;attachTemplateToLocal:false;"
    camera
    position="0 1.6 -30"
    spawn-in-circle="radius:3"
    wasd-controls="acceleration:500"
    look-controls
    gun="bulletTemplate:#bullet-template"
    collider-check
>
<!--
    <a-sphere class="head" aabb-collider visible="false" random-color radius=".4"></a-sphere>
    <a-entity raycaster="objects: .targetable" position="0 -0.9 0" rotation="90 0 0"></a-entity> -->


    <a-entity
        cursor="fuse: true; fuseTimeout: 500"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        material="color: black; shader: flat"
        id="cursor">
    </a-entity>

</a-entity>

</a-scene>


<script>
    // On mobile remove elements that are resource heavy
    var isMobile = AFRAME.utils.device.isMobile();

    if (isMobile) {
        var particles = document.getElementById('particles');
        particles.parentNode.removeChild(particles);
    }

    // Define custom schema for syncing avatar components
    NAF.schemas.add({
        template: '#avatar-template',
        components: [
            'position',
            'rotation',
            {
                selector: '.head',
                component: 'material'
            }
        ]
    });
</script>
<div id="mask-pain"
    style="display: none; width: 100%; height: 100%; position: fixed; top: 0; left: 0; background-color: brown; opacity: .2; transition: .3s;">
</div>
</body>

</html>
